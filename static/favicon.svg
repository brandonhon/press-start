<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- SNES dialog-box backdrop (so it reads on light & dark tabs) -->
  <rect x="0" y="0" width="16" height="16" fill="#15206b"/>
  <rect x="1" y="1" width="14" height="14" fill="#2238a8"/>
  <!-- pixel HP heart -->
  <g fill="#f04040">
    <rect x="3" y="4" width="4" height="1"/>
    <rect x="9" y="4" width="4" height="1"/>
    <rect x="2" y="5" width="12" height="1"/>
    <rect x="2" y="6" width="12" height="1"/>
    <rect x="3" y="7" width="10" height="1"/>
    <rect x="4" y="8" width="8" height="1"/>
    <rect x="5" y="9" width="6" height="1"/>
    <rect x="6" y="10" width="4" height="1"/>
    <rect x="7" y="11" width="2" height="1"/>
  </g>
  <!-- highlight glint -->
  <g fill="#ff9a9a">
    <rect x="3" y="5" width="2" height="1"/>
    <rect x="3" y="6" width="1" height="1"/>
  </g>
</svg>
