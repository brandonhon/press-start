{% macro project_icon(name) %}
  {% if name == "ember" %}
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
      <g>
        <rect x="6" y="3" width="2" height="2" fill="#f8d030"/>
        <rect x="5" y="5" width="4" height="2" fill="#f08020"/>
        <rect x="4" y="7" width="6" height="3" fill="#e02020"/>
        <rect x="5" y="10" width="4" height="1" fill="#f08020"/>
        <rect x="2" y="11" width="12" height="2" fill="#5a3a1f"/>
        <rect x="3" y="13" width="10" height="1" fill="#3a2410"/>
      </g>
    </svg>
  {% elif name == "server" %}
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
      <g>
        <rect x="2" y="2" width="12" height="3" fill="#707075"/>
        <rect x="3" y="3" width="1" height="1" fill="#58c850"/>
        <rect x="5" y="3" width="6" height="1" fill="#4a4a4a"/>
        <rect x="2" y="6" width="12" height="3" fill="#707075"/>
        <rect x="3" y="7" width="1" height="1" fill="#f8d030"/>
        <rect x="5" y="7" width="6" height="1" fill="#4a4a4a"/>
        <rect x="2" y="10" width="12" height="3" fill="#707075"/>
        <rect x="3" y="11" width="1" height="1" fill="#58c850"/>
        <rect x="5" y="11" width="6" height="1" fill="#4a4a4a"/>
        <rect x="2" y="2" width="12" height="1" fill="#9a9a9a"/>
        <rect x="2" y="6" width="12" height="1" fill="#9a9a9a"/>
        <rect x="2" y="10" width="12" height="1" fill="#9a9a9a"/>
      </g>
    </svg>
  {% else %}
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
      <g>
        <rect x="3" y="2" width="10" height="12" fill="#f8f0d8"/>
        <rect x="3" y="2" width="10" height="1" fill="#c4b890"/>
        <rect x="4" y="4" width="6" height="1" fill="#5a3a1f"/>
        <rect x="4" y="6" width="8" height="1" fill="#5a3a1f"/>
        <rect x="4" y="8" width="7" height="1" fill="#5a3a1f"/>
        <rect x="4" y="10" width="8" height="1" fill="#5a3a1f"/>
        <rect x="4" y="12" width="5" height="1" fill="#5a3a1f"/>
        <rect x="3" y="2" width="1" height="12" fill="#c4b890"/>
        <rect x="12" y="2" width="1" height="12" fill="#c4b890"/>
        <rect x="3" y="13" width="10" height="1" fill="#c4b890"/>
      </g>
    </svg>
  {% endif %}
{% endmacro project_icon %}
